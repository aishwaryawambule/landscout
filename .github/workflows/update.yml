name: Update Land Scout

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write   # publishes to the gh-pages branch

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Get the app code (private repo, read-only key)
        uses: actions/checkout@v4
        with:
          repository: aishwaryawambule/land-scout
          ssh-key: ${{ secrets.CODE_DEPLOY_KEY }}
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - run: pip install -r code/requirements.txt

      - name: Restore listings database, map data and photos
        uses: actions/cache/restore@v4
        with:
          path: data
          key: landscout-data-${{ github.run_id }}
          restore-keys: landscout-data-

      - name: Collect new listings
        working-directory: code
        continue-on-error: true
        env:
          DATA_DIR: ${{ github.workspace }}/data
          MAX_DETAILS_PER_RUN: "600"
        run: python -m landscout scan

      - name: Build the website
        working-directory: code
        env:
          DATA_DIR: ${{ github.workspace }}/data
        run: python -m landscout build-site ${{ github.workspace }}/_site --root /landscout/

      - name: Keep data for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: landscout-data-${{ github.run_id }}

      - name: Publish to the gh-pages branch (replaces the previous version, so the repo stays small)
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "land-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update listings $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
